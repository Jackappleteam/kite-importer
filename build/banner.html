<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#fff;font-family:Inter,system-ui,sans-serif;color:#0c0a09;position:relative;overflow:hidden}
.glow{position:absolute;right:-180px;top:-200px;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,#fed7aa 0%,#fff7ed 55%,#fff 72%)}
.wrap{position:absolute;inset:0;padding:72px 84px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:14px}
.beta{padding:6px 16px;border-radius:999px;background:#facc15;color:#422006;font-weight:700;font-size:22px;letter-spacing:.06em}
.unoff{padding:6px 16px;border-radius:999px;background:#fff7ed;border:1.5px solid #fed7aa;color:#7c2d12;font-weight:600;font-size:22px}
h1{font-size:104px;line-height:1.02;letter-spacing:-.035em;font-weight:800}
h1 span{color:#f97316}
p{margin-top:22px;font-size:34px;line-height:1.35;color:#44403c;max-width:760px}
.flow{display:flex;align-items:center;gap:20px}
.chip{padding:14px 26px;border-radius:16px;border:2px solid #e7e5e4;background:#fff;font-weight:600;font-size:30px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.arrow{font-size:40px;color:#f97316;font-weight:700}
.kite{display:flex;align-items:center;gap:14px;padding:12px 28px 12px 18px;border-radius:16px;background:#f97316;color:#fafaf9;font-weight:700;font-size:30px;box-shadow:0 4px 14px rgba(249,115,22,.35)}
.kite img{width:44px;height:44px;filter:brightness(0) invert(1)}
</style></head><body><div class="glow"></div><div class="wrap">
<div class="top"><span class="beta">BETA</span><span class="unoff">Unofficial</span></div>
<div><h1>Move to <span>Kite</span></h1><p>Convert your BotGhost and inventor.bot commands into Kite JSON.</p></div>
<div class="flow"><span class="chip">BotGhost</span><span class="chip">inventor.bot</span><span class="arrow">→</span><span class="kite"><img src="favicon.svg">Kite</span></div>
</div></body></html>
